version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: personaliz-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: personaliz
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/prisma/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - personaliz-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: personaliz-backend
    environment:
      - NODE_ENV=development
      - PORT=4000
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/personaliz
      - SYNC_API_KEY=${SYNC_API_KEY}
      - SYNC_API_BASE=${SYNC_API_BASE:-https://api.sync.so}
      - SYNC_MAX_WAIT_TIME=${SYNC_MAX_WAIT_TIME:-300000}
      - ORIGINAL_VIDEO_ID=${ORIGINAL_VIDEO_ID}
      - TWILIO_SID=${TWILIO_SID}
      - TWILIO_TOKEN=${TWILIO_TOKEN}
      - TWILIO_WHATSAPP_NUMBER=${TWILIO_WHATSAPP_NUMBER}
      - TWILIO_MESSAGING_SERVICE_SID=${TWILIO_MESSAGING_SERVICE_SID}
      - WEBHOOK_BASE_URL=${WEBHOOK_BASE_URL:-http://localhost:4000}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - WATI_API_KEY=${WATI_API_KEY}
      - WATI_BASE_URL=${WATI_BASE_URL}
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - personaliz-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend/peronaliz
      dockerfile: Dockerfile
    container_name: personaliz-frontend
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:4000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend/peronaliz:/app
      - /app/node_modules
      - /app/.next
    networks:
      - personaliz-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  personaliz-network:
    driver: bridge
